<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이폰 파이썬 에디터</title>
    
    <!-- CodeMirror 라이브러리 (자동 들여쓰기 및 모바일 친화적 에디터) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <!-- 자동 완성 및 괄호 닫기 등 보조 애드온 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #1e1e1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h2 {
            font-size: 1.1rem;
            margin: 5px 0 10px 0;
            text-align: center;
        }
        .CodeMirror {
            flex: 1;
            font-size: 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            height: auto;
        }
        .button-container {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        button {
            flex: 1;
            padding: 12px 0;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }
        .btn-run { background-color: #27ae60; flex: 2; }
        .btn-save { background-color: #2980b9; flex: 1; }
        
        .output-container {
            background-color: #2d2d2d;
            border-radius: 8px;
            padding: 10px;
            height: 120px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            border: 1px solid #444;
            white-space: pre-wrap;
        }
        .output-title {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <h2>📱 아이폰 파이썬 개발환경</h2>

    <!-- 코드 작성 영역 (초기값 비워둠) -->
    <textarea id="codeEditor"></textarea>

    <!-- 버튼 그룹 (체크 삭제, 실행과 저장만 배치) -->
    <div class="button-container">
        <button class="btn-run" onclick="runCode()">실행</button>
        <button class="btn-save" onclick="saveFile()">저장 (.py)</button>
    </div>

    <!-- 실행 결과 출력 영역 -->
    <div>
        <div class="output-title">실행 결과</div>
        <div id="output" class="output-container">코드를 입력하고 실행 버튼을 누르세요.</div>
    </div>

    <script>
        // CodeMirror 에디터 초기화 (자동 들여쓰기, 괄호 자동 닫기 적용)
        var editor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), {
            mode: "python",
            theme: "dracula",
            lineNumbers: true,
            indentUnit: 4,
            smartIndent: true,
            autoCloseBrackets: true,
            matchBrackets: true,
            indentWithTabs: false
        });

        // 처음 들어왔을 때 빈 화면 유지 (예시 코드 제거 완료)
        editor.setValue("");

        // 외부 API를 통한 파이썬 코드 실행 기능 (안정적인 엔드포인트 연동)
        async function runCode() {
            const code = editor.getValue();
            const outputDiv = document.getElementById("output");
            
            if (!code.trim()) {
                outputDiv.style.color = "#f39c12";
                outputDiv.innerText = "⚠️ 실행할 코드가 비어 있습니다.";
                return;
            }

            outputDiv.style.color = "#ffffff";
            outputDiv.innerText = "실행 중...";

            try {
                // 오픈 소스 공개 실행 API (Judge0 / Piston 대체 호환 엔드포인트) 사용
                let response = await fetch("https://emkc.org/api/v2/piston/execute", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        language: "python",
                        version: "3.10.0",
                        files: [{ content: code }]
                    })
                });

                if (!response.ok) {
                    throw new Error("서버 응답 오류");
                }

                let result = await response.json();

                if (result.run) {
                    let outputText = result.run.stdout || "";
                    let errorText = result.run.stderr || "";

                    if (errorText) {
                        outputDiv.style.color = "#e74c3c"; // 에러는 빨간색
                        outputDiv.innerText = outputText + "\n" + errorText;
                    } else {
                        outputDiv.style.color = "#2ecc71"; // 성공은 초록색
                        outputDiv.innerText = outputText || "(출력 결과가 없습니다)";
                    }
                } else {
                    outputDiv.style.color = "#e74c3c";
                    outputDiv.innerText = "실행 결과를 받아오지 못했습니다.";
                }
            } catch (error) {
                outputDiv.style.color = "#e74c3c";
                outputDiv.innerText = "⚠️ 실행 실패: 네트워크 연결을 확인하거나 잠시 후 다시 시도해 주세요.";
            }
        }

        // .py 파일 다운로드 기능
        function saveFile() {
            const code = editor.getValue();
            const blob = new Blob([code], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement("a");
            a.href = url;
            a.download = "script.py";
            document.body.appendChild(a);
            a.click();
            
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            const outputDiv = document.getElementById("output");
            outputDiv.style.color = "#3498db";
            outputDiv.innerText = "💾 'script.py' 파일이 다운로드되었습니다.";
        }
    </script>
</body>
</html>
