<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이폰 파이썬 에디터</title>
    
    <!-- CodeMirror 라이브러리 (자동 들여쓰기 및 에디터) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #1e1e1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h2 {
            font-size: 1.1rem;
            margin: 5px 0 5px 0;
            text-align: center;
        }
        #currentFileName {
            font-size: 11px;
            color: #3498db;
            text-align: center;
            margin-bottom: 5px;
        }
        .CodeMirror {
            flex: 1;
            font-size: 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            height: auto;
        }
        /* 입력값(Stdin) 작성 영역 스타일 */
        .input-section {
            margin-bottom: 8px;
        }
        .input-title {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 3px;
        }
        #stdinInput {
            width: 100%;
            height: 35px;
            background-color: #2d2d2d;
            border: 1px solid #444;
            border-radius: 6px;
            color: #ffffff;
            padding: 5px 8px;
            font-size: 13px;
            box-sizing: border-box;
        }
        .button-container {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        button, label.btn-load {
            flex: 1;
            padding: 10px 0;
            font-size: 13px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-load { background-color: #8e44ad; }
        .btn-run { background-color: #27ae60; }
        .btn-save { background-color: #2980b9; }
        
        #fileInput {
            display: none;
        }

        .output-container {
            background-color: #2d2d2d;
            border-radius: 8px;
            padding: 8px;
            height: 90px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            border: 1px solid #444;
            white-space: pre-wrap;
        }
        .output-title {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <h2>📱 아이폰 파이썬 에디터</h2>
    <div id="currentFileName">불러온 파일 없음 (새 파일)</div>

    <!-- 코드 작성 영역 -->
    <textarea id="codeEditor"></textarea>

    <!-- input() 함수를 사용할 때 값을 미리 넣어두는 입력값(Stdin) 칸 -->
    <div class="input-section">
        <div class="input-title">입력값 (input()에 전달될 데이터)</div>
        <input type="text" id="stdinInput" placeholder="예: 홍길동 (입력이 여러 개면 엔터로 구분)">
    </div>

    <!-- 버튼 그룹 -->
    <div class="button-container">
        <label class="btn-load" for="fileInput">불러오기</label>
        <input type="file" id="fileInput" accept=".py,.txt" onchange="loadFile(event)">

        <button class="btn-run" onclick="runCode()">실행</button>
        <button class="btn-save" onclick="saveFile()">저장</button>
    </div>

    <!-- 실행 결과 출력 영역 -->
    <div>
        <div class="output-title">실행 결과</div>
        <div id="output" class="output-container">코드를 입력하고 실행 버튼을 누르세요.</div>
    </div>

    <script>
        let openedFileName = "script.py";

        var editor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), {
            mode: "python",
            theme: "dracula",
            lineNumbers: true,
            indentUnit: 4,
            smartIndent: true,
            autoCloseBrackets: true,
            matchBrackets: true,
            indentWithTabs: false
        });

        editor.setValue("");

        function loadFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            openedFileName = file.name;
            document.getElementById("currentFileName").innerText = "현재 파일: " + openedFileName;

            const reader = new FileReader();
            reader.onload = function(e) {
                editor.setValue(e.target.result);
                const outputDiv = document.getElementById("output");
                outputDiv.style.color = "#3498db";
                outputDiv.innerText = `📂 '${file.name}' 파일을 성공적으로 불러왔습니다.`;
            };
            reader.readAsText(file);
            event.target.value = "";
        }

        async function runCode() {
            const code = editor.getValue();
            const stdinValue = document.getElementById("stdinInput").value;
            const outputDiv = document.getElementById("output");
            
            if (!code.trim()) {
                outputDiv.style.color = "#f39c12";
                outputDiv.innerText = "⚠️ 실행할 코드가 비어 있습니다.";
                return;
            }

            outputDiv.style.color = "#ffffff";
            outputDiv.innerText = "실행 중...";

            try {
                let response = await fetch("https://ce.judge0.com/submissions?base64_encoded=false&wait=true", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        language_id: 71, // Python (3.8.1)
                        source_code: code,
                        stdin: stdinValue // input()에 들어갈 데이터를 함께 전송
                    })
                });

                if (!response.ok) {
                    throw new Error("서버 통신 실패");
                }

                let result = await response.json();

                let stdout = result.stdout || "";
                let stderr = result.stderr || result.compile_output || "";

                if (stderr) {
                    outputDiv.style.color = "#e74c3c";
                    outputDiv.innerText = stdout + "\n" + stderr;
                } else {
                    outputDiv.style.color = "#2ecc71";
                    outputDiv.innerText = stdout || "(출력 결과가 없습니다)";
                }
            } catch (error) {
                outputDiv.style.color = "#e74c3c";
                outputDiv.innerText = "⚠️ 실행 실패: 네트워크 상태를 확인하거나 잠시 후 다시 시도해 주세요.";
            }
        }

        function saveFile() {
            const code = editor.getValue();
            const blob = new Blob([code], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement("a");
            a.href = url;
            a.download = openedFileName;
            document.body.appendChild(a);
            a.click();
            
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            const outputDiv = document.getElementById("output");
            outputDiv.style.color = "#3498db";
            outputDiv.innerText = `💾 '${openedFileName}' 파일로 저장(다운로드)되었습니다.`;
        }
    </script>
</body>
</html>
